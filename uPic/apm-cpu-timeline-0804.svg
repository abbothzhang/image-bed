<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">APM CPU 时间线双折线图</title>
  <desc id="desc">展示 APM 两个实例的 CPU 利用率变化，并标注 ss-1 异常下探和 00:05 峰值。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#eef6f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#1f2937" flood-opacity="0.10"/>
    </filter>
    <style>
      text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #1f2937; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #475569; }
      .tick { font-size: 13px; fill: #64748b; }
      .note-title { font-size: 15px; font-weight: 700; }
      .note-body { font-size: 13px; fill: #334155; }
      .legend { font-size: 13px; fill: #475569; }
    </style>
  </defs>
  <rect x="0" y="0" width="1200" height="590" rx="28" fill="url(#bg)"/>
  <rect x="36" y="30" width="1128" height="524" rx="24" fill="#ffffff" filter="url(#shadow)"/>
  <text x="76" y="80" class="title">APM CPU 利用率趋势图</text>
  <text x="76" y="108" class="subtitle">2026-08-03 23:00 至 2026-08-04 00:30（CST）</text>
  <g transform="translate(76 116)">
    <line x1="0" y1="0" x2="18" y2="0" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>
    <text x="28" y="5" class="legend">ss-0</text>
    <line x1="110" y1="0" x2="128" y2="0" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>
    <text x="138" y="5" class="legend">ss-1</text>
  </g>
  <g transform="translate(90 155)">
    <line x1="0" y1="0" x2="0" y2="330" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="0" y1="330" x2="1000" y2="330" stroke="#94a3b8" stroke-width="1.5"/>
    <g stroke="#e2e8f0" stroke-width="1">
      <line x1="0" y1="330" x2="1000" y2="330"/>
      <line x1="0" y1="264" x2="1000" y2="264"/>
      <line x1="0" y1="198" x2="1000" y2="198"/>
      <line x1="0" y1="132" x2="1000" y2="132"/>
      <line x1="0" y1="66" x2="1000" y2="66"/>
      <line x1="0" y1="0" x2="1000" y2="0"/>
    </g>
    <g class="tick">
      <text x="-14" y="335" text-anchor="end">10</text>
      <text x="-14" y="269" text-anchor="end">20</text>
      <text x="-14" y="203" text-anchor="end">30</text>
      <text x="-14" y="137" text-anchor="end">40</text>
      <text x="-14" y="71" text-anchor="end">50</text>
      <text x="-14" y="5" text-anchor="end">60+</text>
    </g>
    <g class="tick">
      <text x="0" y="360" text-anchor="middle">23:00</text>
      <text x="125" y="360" text-anchor="middle">23:20</text>
      <text x="250" y="360" text-anchor="middle">23:28</text>
      <text x="375" y="360" text-anchor="middle">23:50</text>
      <text x="500" y="360" text-anchor="middle">00:00</text>
      <text x="625" y="360" text-anchor="middle">00:05</text>
      <text x="750" y="360" text-anchor="middle">00:10</text>
      <text x="875" y="360" text-anchor="middle">00:20</text>
      <text x="1000" y="360" text-anchor="middle">00:30</text>
    </g>
    <path d="M0,110.2 L125,97 L250,97 L375,83.8 L500,50.8 L625,0 L750,37.6 L875,70.6 L1000,169.6" fill="none" stroke="#b45309" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M0,143.2 L125,70.6 L250,268.4 L375,209 L500,169.4 L625,116.6 L750,176 L875,195.8 L1000,228.8" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#b45309" stroke="#ffffff" stroke-width="3">
      <circle cx="0" cy="110.2" r="5"/><circle cx="125" cy="97" r="5"/><circle cx="250" cy="97" r="5"/><circle cx="375" cy="83.8" r="5"/><circle cx="500" cy="50.8" r="5"/><circle cx="625" cy="0" r="6"/><circle cx="750" cy="37.6" r="5"/><circle cx="875" cy="70.6" r="5"/><circle cx="1000" cy="169.6" r="5"/>
    </g>
    <g fill="#16a34a" stroke="#ffffff" stroke-width="3">
      <circle cx="0" cy="143.2" r="5"/><circle cx="125" cy="70.6" r="5"/><circle cx="250" cy="268.4" r="5"/><circle cx="375" cy="209" r="5"/><circle cx="500" cy="169.4" r="5"/><circle cx="625" cy="116.6" r="5"/><circle cx="750" cy="176" r="5"/><circle cx="875" cy="195.8" r="5"/><circle cx="1000" cy="228.8" r="5"/>
    </g>
    <g>
      <line x1="250" y1="268.4" x2="330" y2="245" stroke="#64748b" stroke-width="1.5"/>
      <rect x="330" y="218" width="190" height="52" rx="12" fill="#fff7ed" stroke="#fdba74"/>
      <text x="346" y="240" class="note-title" fill="#c2410c">23:28 ss-1 骤降</text>
      <text x="346" y="260" class="note-body">CPU 突然下探，疑似重启或切换</text>
    </g>
    <g>
      <line x1="625" y1="0" x2="700" y2="34" stroke="#64748b" stroke-width="1.5"/>
      <rect x="700" y="10" width="176" height="56" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="716" y="32" class="note-title" fill="#1d4ed8">00:05 峰值</text>
      <text x="716" y="52" class="note-body">ss-0 拉升到约 74%，刷新流量集中</text>
    </g>
    <g>
      <line x1="375" y1="209" x2="280" y2="188" stroke="#64748b" stroke-width="1.5"/>
      <rect x="60" y="174" width="196" height="52" rx="12" fill="#f0fdf4" stroke="#86efac"/>
      <text x="76" y="196" class="note-title" fill="#15803d">23:50 恢复中</text>
      <text x="76" y="216" class="note-body">ss-1 从异常低位逐步爬升</text>
    </g>
  </g>
</svg>

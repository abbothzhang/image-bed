<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">Penelope CPU 时间线双折线图</title>
  <desc id="desc">展示 Penelope 两个 Pod 的 CPU 利用率变化，并标注峰值与回落情况。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#eef6f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#1f2937" flood-opacity="0.10"/>
    </filter>
    <style>
      text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #1f2937; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #475569; }
      .tick { font-size: 13px; fill: #64748b; }
      .note-title { font-size: 15px; font-weight: 700; }
      .note-body { font-size: 13px; fill: #334155; }
      .legend { font-size: 13px; fill: #475569; }
    </style>
  </defs>
  <rect x="0" y="0" width="1200" height="580" rx="28" fill="url(#bg)"/>
  <rect x="36" y="30" width="1128" height="514" rx="24" fill="#ffffff" filter="url(#shadow)"/>
  <text x="76" y="80" class="title">Penelope CPU 利用率趋势图</text>
  <text x="76" y="108" class="subtitle">2026-08-03 23:00 至 2026-08-04 00:20（CST）</text>
  <g transform="translate(76 116)">
    <line x1="0" y1="0" x2="18" y2="0" stroke="#db2777" stroke-width="4" stroke-linecap="round"/>
    <text x="28" y="5" class="legend">49kw7</text>
    <line x1="110" y1="0" x2="128" y2="0" stroke="#0891b2" stroke-width="4" stroke-linecap="round"/>
    <text x="138" y="5" class="legend">q5qwj</text>
  </g>
  <g transform="translate(90 150)">
    <line x1="0" y1="0" x2="0" y2="330" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="0" y1="330" x2="1000" y2="330" stroke="#94a3b8" stroke-width="1.5"/>
    <g stroke="#e2e8f0" stroke-width="1">
      <line x1="0" y1="330" x2="1000" y2="330"/>
      <line x1="0" y1="264" x2="1000" y2="264"/>
      <line x1="0" y1="198" x2="1000" y2="198"/>
      <line x1="0" y1="132" x2="1000" y2="132"/>
      <line x1="0" y1="66" x2="1000" y2="66"/>
      <line x1="0" y1="0" x2="1000" y2="0"/>
    </g>
    <g class="tick">
      <text x="-14" y="335" text-anchor="end">5</text>
      <text x="-14" y="269" text-anchor="end">7</text>
      <text x="-14" y="203" text-anchor="end">9</text>
      <text x="-14" y="137" text-anchor="end">11</text>
      <text x="-14" y="71" text-anchor="end">13</text>
      <text x="-14" y="5" text-anchor="end">15</text>
    </g>
    <g class="tick">
      <text x="0" y="360" text-anchor="middle">23:00</text>
      <text x="200" y="360" text-anchor="middle">23:30~59</text>
      <text x="400" y="360" text-anchor="middle">00:00</text>
      <text x="600" y="360" text-anchor="middle">00:04</text>
      <text x="800" y="360" text-anchor="middle">00:10</text>
      <text x="1000" y="360" text-anchor="middle">00:20</text>
    </g>
    <path d="M0,260.7 L200,287.1 L400,207.9 L600,34.98 L800,178.2 L1000,297" fill="none" stroke="#db2777" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M0,273.9 L200,303.6 L400,217.8 L600,34.98 L800,234.3 L1000,310.2" fill="none" stroke="#0891b2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#db2777" stroke="#ffffff" stroke-width="3">
      <circle cx="0" cy="260.7" r="5"/><circle cx="200" cy="287.1" r="5"/><circle cx="400" cy="207.9" r="5"/><circle cx="600" cy="34.98" r="6"/><circle cx="800" cy="178.2" r="5"/><circle cx="1000" cy="297" r="5"/>
    </g>
    <g fill="#0891b2" stroke="#ffffff" stroke-width="3">
      <circle cx="0" cy="273.9" r="5"/><circle cx="200" cy="303.6" r="5"/><circle cx="400" cy="217.8" r="5"/><circle cx="600" cy="34.98" r="6"/><circle cx="800" cy="234.3" r="5"/><circle cx="1000" cy="310.2" r="5"/>
    </g>
    <g>
      <line x1="400" y1="207.9" x2="480" y2="158" stroke="#64748b" stroke-width="1.5"/>
      <rect x="480" y="130" width="160" height="52" rx="12" fill="#fff7ed" stroke="#fdba74"/>
      <text x="496" y="152" class="note-title" fill="#c2410c">00:00 开始上升</text>
      <text x="496" y="172" class="note-body">活动开始后双 Pod 同步拉升</text>
    </g>
    <g>
      <line x1="600" y1="34.98" x2="688" y2="24" stroke="#64748b" stroke-width="1.5"/>
      <rect x="688" y="8" width="176" height="56" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="704" y="30" class="note-title" fill="#1d4ed8">00:04 峰值</text>
      <text x="704" y="50" class="note-body">两个 Pod 都接近 13.9%</text>
    </g>
    <g>
      <line x1="1000" y1="297" x2="900" y2="286" stroke="#64748b" stroke-width="1.5"/>
      <rect x="690" y="272" width="194" height="52" rx="12" fill="#f0fdf4" stroke="#86efac"/>
      <text x="706" y="294" class="note-title" fill="#15803d">00:20 回到基线</text>
      <text x="706" y="314" class="note-body">CPU 已回落到夜间常态区间</text>
    </g>
  </g>
</svg>

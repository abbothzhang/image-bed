<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">SLDB QPS 时间线曲线图</title>
  <desc id="desc">展示 2026-08-03 23:00 至 2026-08-04 00:30 的 SLDB QPS 变化，并标注关键备注。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#eef6f0"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f80ed" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#2f80ed" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#1f2937" flood-opacity="0.10"/>
    </filter>
    <style>
      text {
        font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
        fill: #1f2937;
      }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #475569; }
      .axis { font-size: 14px; fill: #64748b; }
      .tick { font-size: 13px; fill: #64748b; }
      .note-title { font-size: 15px; font-weight: 700; }
      .note-body { font-size: 13px; fill: #334155; }
      .legend { font-size: 13px; fill: #475569; }
      .point-label { font-size: 12px; font-weight: 700; fill: #0f172a; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="560" rx="28" fill="url(#bg)"/>
  <rect x="36" y="30" width="1128" height="494" rx="24" fill="#ffffff" filter="url(#shadow)"/>

  <text x="76" y="80" class="title">SLDB QPS 时间线趋势图</text>
  <text x="76" y="108" class="subtitle">2026-08-03 23:00 至 2026-08-04 00:30（CST）</text>
  <text x="1098" y="108" text-anchor="end" class="legend">单位：QPS</text>

  <g transform="translate(90 140)">
    <line x1="0" y1="0" x2="0" y2="320" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="0" y1="320" x2="1000" y2="320" stroke="#94a3b8" stroke-width="1.5"/>

    <g stroke="#e2e8f0" stroke-width="1">
      <line x1="0" y1="320" x2="1000" y2="320"/>
      <line x1="0" y1="256" x2="1000" y2="256"/>
      <line x1="0" y1="192" x2="1000" y2="192"/>
      <line x1="0" y1="128" x2="1000" y2="128"/>
      <line x1="0" y1="64" x2="1000" y2="64"/>
      <line x1="0" y1="0" x2="1000" y2="0"/>
    </g>

    <g class="tick">
      <text x="-14" y="325" text-anchor="end">5,000</text>
      <text x="-14" y="261" text-anchor="end">6,000</text>
      <text x="-14" y="197" text-anchor="end">7,000</text>
      <text x="-14" y="133" text-anchor="end">8,000</text>
      <text x="-14" y="69" text-anchor="end">9,000</text>
      <text x="-14" y="5" text-anchor="end">10,000</text>
    </g>

    <g class="tick">
      <text x="0" y="350" text-anchor="middle">23:00</text>
      <text x="110" y="350" text-anchor="middle">23:01</text>
      <text x="220" y="350" text-anchor="middle">23:02~10</text>
      <text x="330" y="350" text-anchor="middle">23:10~59</text>
      <text x="440" y="350" text-anchor="middle">00:00</text>
      <text x="550" y="350" text-anchor="middle">00:01</text>
      <text x="660" y="350" text-anchor="middle">00:04</text>
      <text x="770" y="350" text-anchor="middle">00:08</text>
      <text x="880" y="350" text-anchor="middle">00:15</text>
      <text x="1000" y="350" text-anchor="middle">00:30</text>
    </g>

    <path d="M0,262.2 L110,171.3 L220,237.7 L330,276.8 L440,261.7 L550,147.5 L660,154.9 L770,178.2 L880,237.6 L1000,268.7 L1000,320 L0,320 Z" fill="url(#area)"/>
    <path d="M0,262.2 L110,171.3 L220,237.7 L330,276.8 L440,261.7 L550,147.5 L660,154.9 L770,178.2 L880,237.6 L1000,268.7" fill="none" stroke="#2f80ed" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <g fill="#2f80ed" stroke="#ffffff" stroke-width="3">
      <circle cx="0" cy="262.2" r="6"/>
      <circle cx="110" cy="171.3" r="6"/>
      <circle cx="220" cy="237.7" r="6"/>
      <circle cx="330" cy="276.8" r="6"/>
      <circle cx="440" cy="261.7" r="6"/>
      <circle cx="550" cy="147.5" r="7"/>
      <circle cx="660" cy="154.9" r="7"/>
      <circle cx="770" cy="178.2" r="6"/>
      <circle cx="880" cy="237.6" r="6"/>
      <circle cx="1000" cy="268.7" r="6"/>
    </g>

    <g class="point-label">
      <text x="550" y="132" text-anchor="middle">9,490</text>
      <text x="660" y="139" text-anchor="middle">9,260</text>
    </g>

    <g>
      <line x1="110" y1="171.3" x2="160" y2="108" stroke="#64748b" stroke-width="1.5"/>
      <rect x="160" y="72" width="180" height="52" rx="12" fill="#fff7ed" stroke="#fdba74"/>
      <text x="176" y="94" class="note-title" fill="#c2410c">23:01 预热脉冲</text>
      <text x="176" y="114" class="note-body">QPS 升至 8,749，疑似预热或定时任务</text>
    </g>

    <g>
      <line x1="550" y1="147.5" x2="580" y2="44" stroke="#64748b" stroke-width="1.5"/>
      <rect x="580" y="8" width="188" height="56" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="596" y="30" class="note-title" fill="#1d4ed8">00:01 峰值</text>
      <text x="596" y="50" class="note-body">活动开始后 1 分钟达到 9,490</text>
    </g>

    <g>
      <line x1="660" y1="154.9" x2="732" y2="96" stroke="#64748b" stroke-width="1.5"/>
      <rect x="732" y="68" width="176" height="52" rx="12" fill="#f0fdf4" stroke="#86efac"/>
      <text x="748" y="90" class="note-title" fill="#15803d">00:04 二次峰值</text>
      <text x="748" y="110" class="note-body">高位维持，峰值回落有限</text>
    </g>

    <g>
      <line x1="770" y1="178.2" x2="860" y2="144" stroke="#64748b" stroke-width="1.5"/>
      <rect x="860" y="118" width="128" height="48" rx="12" fill="#fefce8" stroke="#fde68a"/>
      <text x="876" y="140" class="note-title" fill="#a16207">00:08 开始下降</text>
      <text x="876" y="159" class="note-body">流量逐步回落</text>
    </g>

    <g>
      <line x1="1000" y1="268.7" x2="910" y2="296" stroke="#64748b" stroke-width="1.5"/>
      <rect x="710" y="284" width="184" height="52" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="726" y="306" class="note-title" fill="#334155">00:30 恢复基线</text>
      <text x="726" y="326" class="note-body">QPS 回到 5,703，接近活动前水平</text>
    </g>

    <g class="axis">
      <text x="-54" y="-10" text-anchor="start">QPS</text>
      <text x="1000" y="390" text-anchor="end">时间线（CST）</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">Zeus CPU 时间线双折线图</title>
  <desc id="desc">展示 Zeus 两个 Pod 的 CPU 利用率变化，并标注延迟峰值与恢复情况。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#eef6f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#1f2937" flood-opacity="0.10"/>
    </filter>
    <style>
      text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #1f2937; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #475569; }
      .tick { font-size: 13px; fill: #64748b; }
      .note-title { font-size: 15px; font-weight: 700; }
      .note-body { font-size: 13px; fill: #334155; }
      .legend { font-size: 13px; fill: #475569; }
    </style>
  </defs>
  <rect x="0" y="0" width="1200" height="580" rx="28" fill="url(#bg)"/>
  <rect x="36" y="30" width="1128" height="514" rx="24" fill="#ffffff" filter="url(#shadow)"/>
  <text x="76" y="80" class="title">Zeus CPU 利用率趋势图</text>
  <text x="76" y="108" class="subtitle">2026-08-03 23:00 至 2026-08-04 00:25（CST）</text>
  <g transform="translate(76 116)">
    <line x1="0" y1="0" x2="18" y2="0" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
    <text x="28" y="5" class="legend">dbmc6</text>
    <line x1="110" y1="0" x2="128" y2="0" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
    <text x="138" y="5" class="legend">wwlnv</text>
  </g>
  <g transform="translate(90 150)">
    <line x1="0" y1="0" x2="0" y2="330" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="0" y1="330" x2="1000" y2="330" stroke="#94a3b8" stroke-width="1.5"/>
    <g stroke="#e2e8f0" stroke-width="1">
      <line x1="0" y1="330" x2="1000" y2="330"/>
      <line x1="0" y1="264" x2="1000" y2="264"/>
      <line x1="0" y1="198" x2="1000" y2="198"/>
      <line x1="0" y1="132" x2="1000" y2="132"/>
      <line x1="0" y1="66" x2="1000" y2="66"/>
      <line x1="0" y1="0" x2="1000" y2="0"/>
    </g>
    <g class="tick">
      <text x="-14" y="335" text-anchor="end">15</text>
      <text x="-14" y="269" text-anchor="end">20</text>
      <text x="-14" y="203" text-anchor="end">25</text>
      <text x="-14" y="137" text-anchor="end">30</text>
      <text x="-14" y="71" text-anchor="end">35</text>
      <text x="-14" y="5" text-anchor="end">40+</text>
    </g>
    <g class="tick">
      <text x="0" y="360" text-anchor="middle">23:00</text>
      <text x="111" y="360" text-anchor="middle">23:10</text>
      <text x="222" y="360" text-anchor="middle">23:30~59</text>
      <text x="333" y="360" text-anchor="middle">00:00</text>
      <text x="444" y="360" text-anchor="middle">00:01</text>
      <text x="555" y="360" text-anchor="middle">00:05</text>
      <text x="666" y="360" text-anchor="middle">00:16</text>
      <text x="777" y="360" text-anchor="middle">00:18</text>
      <text x="888" y="360" text-anchor="middle">00:20</text>
      <text x="1000" y="360" text-anchor="middle">00:25</text>
    </g>
    <path d="M0,132 L111,92.4 L222,184.8 L333,171.6 L444,132 L555,52.8 L666,0 L777,0 L888,39.6 L1000,158.4" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M0,211.2 L111,158.4 L222,237.6 L333,224.4 L444,198 L555,118.8 L666,66 L777,39.6 L888,79.2 L1000,224.4" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#dc2626" stroke="#ffffff" stroke-width="3">
      <circle cx="0" cy="132" r="5"/><circle cx="111" cy="92.4" r="5"/><circle cx="222" cy="184.8" r="5"/><circle cx="333" cy="171.6" r="5"/><circle cx="444" cy="132" r="5"/><circle cx="555" cy="52.8" r="5"/><circle cx="666" cy="0" r="6"/><circle cx="777" cy="0" r="6"/><circle cx="888" cy="39.6" r="5"/><circle cx="1000" cy="158.4" r="5"/>
    </g>
    <g fill="#2563eb" stroke="#ffffff" stroke-width="3">
      <circle cx="0" cy="211.2" r="5"/><circle cx="111" cy="158.4" r="5"/><circle cx="222" cy="237.6" r="5"/><circle cx="333" cy="224.4" r="5"/><circle cx="444" cy="198" r="5"/><circle cx="555" cy="118.8" r="5"/><circle cx="666" cy="66" r="5"/><circle cx="777" cy="39.6" r="6"/><circle cx="888" cy="79.2" r="5"/><circle cx="1000" cy="224.4" r="5"/>
    </g>
    <g>
      <line x1="444" y1="132" x2="510" y2="94" stroke="#64748b" stroke-width="1.5"/>
      <rect x="510" y="66" width="160" height="52" rx="12" fill="#fff7ed" stroke="#fdba74"/>
      <text x="526" y="88" class="note-title" fill="#c2410c">00:01 开始上升</text>
      <text x="526" y="108" class="note-body">活动后进入持续拉升阶段</text>
    </g>
    <g>
      <line x1="777" y1="0" x2="820" y2="34" stroke="#64748b" stroke-width="1.5"/>
      <rect x="820" y="10" width="164" height="56" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="836" y="32" class="note-title" fill="#1d4ed8">00:18 延迟峰值</text>
      <text x="836" y="52" class="note-body">dbmc6 约 46%，wwlnv 约 36%</text>
    </g>
    <g>
      <line x1="1000" y1="158.4" x2="920" y2="218" stroke="#64748b" stroke-width="1.5"/>
      <rect x="710" y="208" width="194" height="52" rx="12" fill="#f0fdf4" stroke="#86efac"/>
      <text x="726" y="230" class="note-title" fill="#15803d">00:25 恢复基线</text>
      <text x="726" y="250" class="note-body">两个 Pod 基本回到夜间水平</text>
    </g>
  </g>
</svg>
